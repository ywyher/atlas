[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
governor = "0.10.4"
meilisearch-sdk = "0.33.0"
nonzero_ext = "0.3.0"
reqwest = { version = "0.13.4", features = ["brotli", "deflate", "gzip", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
