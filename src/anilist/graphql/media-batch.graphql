query ScrapeAnilist($page: Int, $perPage: Int, $start: FuzzyDateInt, $end: FuzzyDateInt) {
  Page(page: $page, perPage: $perPage) {
    pageInfo { 
      total
      hasNextPage
      lastPage
    }
    media(
      type: ANIME
      sort: START_DATE
      startDate_greater: $start
      startDate_lesser: $end
    ) {
      id
      idMal
      title {
        romaji
        english
        native
      }
      coverImage {
        medium
        large
        extraLarge
      }
      format
      status
      season
      seasonYear
      synonyms
      
      bannerImage
      description
      episodes
      duration
      genres
      averageScore
      popularity
      
      nextAiringEpisode {
        episode
        airingAt
        timeUntilAiring
      }

      startDate {
        day
        month
        year
      }
      
      endDate {
        day
        month
        year
      }
      
      studios {
        edges {
          isMain
          node {
            name
            isAnimationStudio
          }
        }
      }
      
      characters {
        edges {
          node {
            name {
              first
              last
            }
            age
            image {
              large
            }
          }
          role
          voiceActors {
            name {
              first
              last
            }
            image {
              large
            }
          }
        }
      }
      
      relations {
        edges {
          relationType
          node {
            id
            title {
              english
              romaji
              native
            }
            bannerImage
            coverImage {
              medium
              large
              extraLarge
            }
            startDate {
              year
              month
              day
            }
            endDate {
              year
              month
              day
            }
            status
            format
          }
        }
      }
      
      recommendations {
        edges {
          node {
            mediaRecommendation {
              id
              title {
                english
                romaji
                native
              }
              coverImage {
                medium
                large
                extraLarge
              }
              status
              format
              averageScore
              seasonYear
            }
          }
        }
      }
      
      trailer {
        thumbnail
        id
        site
      }
      
      externalLinks {
        id
        site
        siteId
        type
        color
        url
      }
    }
  }
}